name: Web preview release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-web-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: tar -czf "nova-web-preview-${GITHUB_REF_NAME}.tar.gz" dist README.md docs
      - uses: softprops/action-gh-release@v2
        with:
          files: nova-web-preview-*.tar.gz